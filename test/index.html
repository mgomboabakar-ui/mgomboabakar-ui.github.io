<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gargoura Digital Bank</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        body { background: linear-gradient(to bottom, #4F46E5, #F97316); 
               color: white; text-align: center; font-family: Arial; padding: 30px; }
        .card { background: rgba(0,0,0,0.3); padding: 30px; border-radius: 20px; max-width: 400px; margin: auto; }
        button { background: #10B981; color: white; border: none; padding: 15px 30px; 
                 border-radius: 10px; font-size: 16px; cursor: pointer; margin: 10px; }
        .badge { padding: 5px 15px; border-radius: 20px; font-size: 12px; display: inline-block; margin-bottom: 10px; }
        .testnet { background: #F97316; }
        .mainnet { background: #4F46E5; }
    </style>
</head>
<body>
    <div class="card">
        <div id="network-badge" class="badge">Chargement...</div>
        <h1>Gargoura Digital Bank</h1>
        <p>La banque digitale des pionniers Pi</p>
        <button onclick="login()">Se connecter avec Pi</button>
        <button onclick="pay()">Faire un paiement test</button>
        <p id="status" style="font-size: 12px; margin-top: 20px;"></p>
    </div>

    <script>
      // 1. DÉTECTION AUTO TESTNET OU MAINNET
      const hostname = window.location.hostname;
      const isTestnet = hostname.includes('7224') || window.location.search.includes('testnet=true');
      
      const NETWORK = {
        mode: isTestnet ? 'TESTNET' : 'MAINNET',
        sandbox: isTestnet ? true : false
      };

      // 2. AFFICHER LE BADGE
      const badge = document.getElementById('network-badge');
      badge.className = `badge ${NETWORK.mode === 'TESTNET' ? 'testnet' : 'mainnet'}`;
      badge.innerText = NETWORK.mode;
      
      // 3. INIT DU SDK PI
      pi.init({ version: "2.0", sandbox: NETWORK.sandbox });
      
      document.getElementById('status').innerText = `Mode: ${NETWORK.mode} | Sandbox: ${NETWORK.sandbox}`;

      // 4. FONCTION CONNEXION
      function login() {
        const scopes = ['username', 'payments'];
        pi.authenticate(scopes, onIncompletePaymentFound, function(auth) {
          alert(`Connecté ! Bonjour ${auth.user.username}\nMode: ${NETWORK.mode}`)
        }).catch(function(error) {
          alert("Erreur: " + error);
        });
      }
      
      // 5. FONCTION PAIEMENT TEST
      function pay() {
        const paymentData = {
          amount: 0.001, // 0.001 Pi
          memo: `Paiement GDB - ${NETWORK.mode}`,
          metadata: { app: "GargouraDB" }
        };
        
        pi.createPayment(paymentData, {
          onReadyForServerApproval: function(paymentId) {
            console.log("A approuver:", paymentId);
            document.getElementById('status').innerText = "Paiement en attente d'approbation...";
          },
          onReadyForServerCompletion: function(paymentId, txid) {
            console.log("A compléter:", paymentId, txid);
            document.getElementById('status').innerText = "Paiement complété ! TX: " + txid;
          },
          onCancel: function(paymentId) { alert("Paiement annulé") },
          onError: function(error) { alert("Erreur paiement: " + error) }
        });
      }
      
      function onIncompletePaymentFound(payment) {
        console.log("Paiement incomplet trouvé", payment);
      }
    </script>
</body>
          </html>
