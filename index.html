<!DOCTYPE html>
<html>
<head>
  <title>Gargoura Digital Bank V2</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    body { font-family: Arial; text-align: center; padding: 50px; background: #6f42c1; color: white; }
    button { padding: 15px 30px; font-size: 18px; background: white; color: #6f42c1; border: none; border-radius: 10px; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <h1>Gargoura Digital Bank V2</h1>
  <p>Bienvenue sur votre banque digitale</p>
  <button id="auth" disabled>Chargement...</button>
  <p id="result"></p>

  <script>
    window.onload = function() {
      // 1. Initialiser Pi SANS sandbox pour Mainnet
      Pi.init({ version: "2.0" });
      
      const btn = document.getElementById('auth');
      btn.innerText = "Se connecter avec Pi";
      btn.disabled = false;

      // 2. Quand on clique
      btn.onclick = function() {
        btn.disabled = true;
        btn.innerText = "Connexion...";
        
        Pi.authenticate(
          ['username', 'payments'], 
          function onReady(auth) {
            document.getElementById('result').innerText = "Connecté : " + auth.user.username;
            btn.innerText = "Connecté";
          }, 
          function onError(error) {
            document.getElementById('result').innerText = "Erreur : " + error;
            btn.disabled = false;
            btn.innerText = "Réessayer";
          }
        );
      }
    }
  </script>
</body>
</html>
