<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gargoura Digital Bank</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        body { background: linear-gradient(to bottom, #4F46E5, #F97316); 
               color: white; text-align: center; font-family: Arial; padding: 50px; }
        .card { background: rgba(0,0,0,0.3); padding: 30px; border-radius: 20px; max-width: 400px; margin: auto; }
        button { background: #10B981; color: white; border: none; padding: 15px 30px; 
                 border-radius: 10px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <img <img src="logo.png" alt="Logo GDB" style="border-radius:50%; width:100px;">
        <h1>Gargoura Digital Bank</h1>
        <p>La banque digitale des pionniers Pi</p>
        <button onclick="login()">Se connecter avec Pi</button>
    </div>

    <script>
      pi.init({ version: "2.0" })
      
      function login() {
        const scopes = ['username', 'payments'];
        pi.authenticate(scopes, onIncompletePaymentFound, function(auth) {
          alert("Connecté ! Bonjour " + auth.user.username)
        }).catch(function(error) {
          console.error(error);
        });
      }
      
      function onIncompletePaymentFound(payment) {
        console.log("Paiement incomplet trouvé", payment);
      }
    </script>
</body>
</html>
